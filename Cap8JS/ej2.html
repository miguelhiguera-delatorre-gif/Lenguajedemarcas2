<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>


    
    <!-- CSS DEL LIGHTBOX -->
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">


    <style>
        /* CONTENEDOR DE LAS IMÁGENES */
        .galeria{

            display: flex;

            /* separación entre imágenes */
            gap: 20px;

        }

        /* IMÁGENES PEQUEÑAS */
        

        .galeria img{

            width: 300px;
            height: 200px;
            border: 2px solid black;
           

        }

        img {
             border-radius: 15px;
        }

        h2{
            margin-left: 365px;
        }

    </style>

</head>
<body>


    
    <!-- GALERÍA -->
   
    <h2>Galería de imagenes</h2>

    <div class="galeria">


        
        <!-- IMAGEN 1 -->
        

        <!-- href = imagen grande -->
        <!-- img src = imagen pequeña -->

        <a href="https://picsum.photos/id/1015/1000/600"

           class="glightbox"

           data-tippy-content="Montaña y lago">

            <img src="https://picsum.photos/id/1015/300/200">

        </a>

        <!-- IMAGEN 2 -->
        

        <a href="https://picsum.photos/id/1018/1000/600"

           class="glightbox"

           data-tippy-content="Bosque natural">

            <img src="https://picsum.photos/id/1018/300/200">

        </a>

        <!-- IMAGEN 3 -->
        

        <a href="https://picsum.photos/id/1035/1000/600"

           class="glightbox"

           data-tippy-content="Playa tropical">

            <img src="https://picsum.photos/id/1035/300/200">

        </a>

    </div>


    <!-- LIBRERÍAS JAVASCRIPT -->
    

    <!-- Lightbox -->
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>


    <!-- Necesario para Tippy -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>


    <!-- Tooltip -->
    <script src="https://unpkg.com/tippy.js@6"></script>



    <script>

        // ACTIVAR LIGHTBOX
        

        // Hace que las imágenes se abran grandes

        GLightbox();

       
        // ACTIVAR TOOLTIPS
        

        tippy('.galeria a', {

            // Mostrar arriba
            placement: 'top',

            // Separación de 15 píxeles
            offset: [0, 15]

        });

    </script>

</body>
</html>
