    TEXTO:
        <input type="text" id="mensaje"  onblur="valida()"/>
        <p id="mensaje2"></p>


<script>
        
        function valida() {    
            
            let mensajeR = document.getElementById("mensaje");

            if (mensajeR.value.length == 0){
                  mensaje2.textContent = "Este campo es obligatorio";
                  mensaje2.style.color = "red";
                  mensaje.style.borderColor = "red";
            }else if ( mensajeR.value.length>=1){
                  mensaje2.textContent = "";
                  mensaje.style.borderColor = "green";
            }
                  
                
           
        }
