<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 7</title>

  <style>

    .rojo {
      color: red;
      font-weight: bold;
    }

  </style>

</head>
<body>

  <h1>Ejercicio 7: Contador con aviso visual</h1>

  <textarea id="texto"></textarea>

  <p>
    Caracteres restantes:
    <span id="contador">100</span>
  </p>

  <script>

    let texto = document.getElementById("texto");
    let contador = document.getElementById("contador");

    let maximo = 100;

    texto.onkeydown = function(event) {

      let especiales = [
        "Backspace",
        "Delete",
        "ArrowLeft",
        "ArrowRight"
      ];

      if (
        texto.value.length >= maximo &&
        !especiales.includes(event.key)
      ) {
        event.preventDefault();
      }

    };

    texto.onkeyup = function() {

      let restantes = maximo - texto.value.length;

      contador.textContent = restantes;

      if (restantes < 10) {

        contador.classList.add("rojo");

      } else {

        contador.classList.remove("rojo");

      }

    };

  </script>

</body>
</html>
