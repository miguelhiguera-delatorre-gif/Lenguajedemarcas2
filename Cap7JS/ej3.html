<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 3</title>
</head>
<body>

  

  <input type="text" id="soloNumeros" >

  <script>
    document.getElementById("soloNumeros").onkeypress = function(event) {

      let tecla = event.key;

      if (!/[0-9]/.test(tecla)) {
        event.preventDefault();
      }

    };
  </script>

</body>
</html>
